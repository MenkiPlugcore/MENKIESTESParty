name: One-time MENKIESTESParty Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source monorepo
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/MenkiPlugcore/plugin.git _source

      - name: Move MENKIESTESParty to repository root
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_source' \
            -exec rm -rf {} +

          cp -a _source/plugins/MENKIESTESParty/. ./
          cp _source/LICENSE ./LICENSE
          cp _source/.gitignore ./.gitignore

          rm -rf _source
          rm -f .migration-trigger

      - name: Commit standalone repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MenkiPlugcore'
          git config user.email 'cfirmansyah327@gmail.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi

          git commit -m 'chore: migrate MENKIESTESParty to standalone repository'
          git push origin HEAD:main
